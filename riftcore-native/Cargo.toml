[package]
name = "riftcore-native"
version = "1.2.6"
edition = "2021"

[dependencies]
wry = "0.47"
tao = "0.30"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rust-embed = "8.5"
mime_guess = "2.0"

[build-dependencies]
winres = "0.1"
