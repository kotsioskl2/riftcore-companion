[package]
name = "riftcore-native"
version = "2.3.5"
edition = "2021"

[lib]
name = "riftcore_native"
path = "src/lib.rs"

[[bin]]
name = "riftcore-native"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu"] }
epaint = { version = "0.37", features = ["monochrome_emoji_fonts"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
futures = "0.3"
ring = { version = "0.17", default-features = false, features = ["alloc"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
